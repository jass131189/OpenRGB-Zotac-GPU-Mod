name: Build OpenRGB Zotac 5070 Ti Plugin (DLL)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-windows-dll:
    runs-on: windows-latest
    steps:
      - name: Checkout plugin source
        uses: actions/checkout@v4

      - name: Install Qt 6 (MSVC 64-bit for OpenRGB 1.1)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'

      - name: Clone OpenRGB 1.1 source headers
        run: |
          git clone --depth 1 https://gitlab.com/CalcProgrammer1/OpenRGB.git ../OpenRGB

      - name: Configure & Build DLL
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 -DOPENRGB_SRC_DIR=../OpenRGB
          cmake --build build --config Release

      - name: Upload OpenRGBZotac5070TiPlugin.dll Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenRGBZotac5070TiPlugin-Windows-x64
          path: build/Release/OpenRGBZotac5070TiPlugin.dll
